name: Release

# Publishes to npm when a GitHub release is published. The release tag must match package.json, e.g. v0.2.0.
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: npm exchanges this OIDC token for a short-lived publish credential, and the package gets
  # a provenance attestation. No NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bun run test
      - run: bun run build
      - name: Publish
        run: npm publish --provenance --access public
